<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!--
      令牌占位符由 server.ts 在读取本文件时替换为进程启动时生成的一次性令牌。
      写操作（POST / DELETE）要带 X-Jevtest-Token 头，见 src/web/security.ts。
      这正是「只有能读到本页面的代码才拿得到令牌」这条防线的工作方式。
    -->
    <meta name="jevtest-token" content="__JEVTEST_TOKEN__" />
    <title>jevtest</title>
    <script>
      /*
       * 主题在首屏绘制前定下来：挪到 app.js（module，defer 语义）会先闪一下浅色。
       * Bootstrap 5.3 不会自己跟随系统，必须显式写 data-bs-theme。
       * 用户在侧栏选过就按选的来（localStorage），否则跟随系统。
       */
      (() => {
        const query = window.matchMedia("(prefers-color-scheme: dark)");
        window.applyTheme = () => {
          const chosen = localStorage.getItem("jevtest-theme");
          const dark = chosen === "dark" || ((chosen === null || chosen === "auto") && query.matches);
          document.documentElement.dataset.bsTheme = dark ? "dark" : "light";
        };
        window.applyTheme();
        query.addEventListener("change", window.applyTheme);
      })();
    </script>
    <!--
      Bootstrap 直接从 node_modules 引，不进打包器——这是 /vendor/ 这条路由存在的目的
      （见 src/web/server.ts 与 security.ts 的 VENDOR_EXTENSIONS）。只引 CSS，不引 JS（D18）。
    -->
    <link rel="stylesheet" href="/vendor/bootstrap/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <div class="shell">
      <aside class="sidebar">
        <a class="brand" href="#/cases" aria-label="jevtest 首页">
          <span class="brand-mark" aria-hidden="true"></span>
          <span class="brand-name">jevtest</span>
        </a>
        <nav id="nav" class="nav-list" aria-label="主导航">
          <a href="#/cases" data-nav="cases">用例</a>
          <a href="#/runs" data-nav="runs">运行</a>
          <a href="#/auth" data-nav="auth">登录态</a>
          <a href="#/new" data-nav="new" class="nav-new">新建用例</a>
        </nav>
        <div class="sidebar-foot">
          <!-- refreshQueue() 每 2 秒重画一次；它同时是「服务还在不在」的心跳 -->
          <span class="queue" id="queue" role="status" aria-live="polite"></span>
          <button type="button" class="theme-toggle" id="theme-toggle"></button>
        </div>
      </aside>
      <div class="main-col">
        <!-- 全局横幅：令牌失效、服务不可达。与哪个页面无关，所以不在 #app 里 -->
        <div id="banner" class="banner-host"></div>
        <main id="app"></main>
      </div>
    </div>
    <div id="toasts" class="toast-host" aria-live="polite"></div>
    <script type="module" src="/app.js"></script>
  </body>
</html>
