<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!--
      令牌占位符由 server.ts 在读取本文件时替换为进程启动时生成的一次性令牌。
      前端每个请求都要带 X-Jevtest-Token 头，见 src/web/security.ts。
      这正是「只有能读到本页面的代码才拿得到令牌」这条防线的工作方式。
    -->
    <meta name="jevtest-token" content="__JEVTEST_TOKEN__" />
    <title>jevtest</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="#/cases">jevtest</a>
      <nav>
        <a href="#/cases">用例</a>
        <a href="#/runs">运行历史</a>
        <a href="#/new">新建用例</a>
      </nav>
      <span class="queue" id="queue" title="在途浏览器 context 数，运行结束后应回到 0"></span>
    </header>
    <main id="app"></main>
    <script type="module" src="/app.js"></script>
  </body>
</html>
